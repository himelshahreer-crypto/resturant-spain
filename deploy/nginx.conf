# Kebab Factory static site: Nginx server blocks (same rules as deploy/.htaccess).
# Put this in the `http` context (e.g. /etc/nginx/sites-available/kebabfactory), set the domain,
# `root` (the uploaded contents of out/) and the certificate paths, then: nginx -t && systemctl reload nginx
#
# Two Nginx rules this file is written around (both verified with nginx 1.24):
#  - `add_header` inside a `location` drops ALL headers set at server level. So no location
#    here uses add_header; per-path values come from the maps below.
#  - A `types { }` block replaces the whole MIME table. The standard mime.types (loaded in the
#    http context by default) already covers avif, webp and woff2, so none is defined here.

# Modern image format for the same URL, by Accept header (files built by scripts/optimize-images.mjs).
map $http_accept $kf_img_suffix {
    default        "";
    "~*image/avif" ".avif";
    "~*image/webp" ".webp";
}

# Cache policy by path.
map $uri $kf_cache {
    default                         "no-cache";                              # pages, navigation data, sitemap, manifest
    ~^/_next/static/                "public, max-age=31536000, immutable";   # content-hashed
    ~^/fonts/                       "public, max-age=31536000, immutable";
    ~^/styles/                      "public, max-age=31536000, immutable";   # linked with ?v=<content hash>
    ~^/assets/                      "public, max-age=604800";
    ~^/(icon|apple-icon|og)         "public, max-age=604800";
}

# Images vary by Accept (avif / webp / original).
map $uri $kf_vary {
    default        "";
    ~^/assets/     "Accept";
}

server {
    listen 443 ssl http2;
    server_name www.example.com;                 # your domain
    ssl_certificate     /etc/letsencrypt/live/www.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.example.com/privkey.pem;

    root /var/www/kebabfactory;                  # contents of out/
    index index.html;
    charset utf-8;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css text/plain text/xml text/javascript application/javascript application/json image/svg+xml application/manifest+json;

    # Security headers (the Content-Security-Policy itself is in each page's <head>).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $kf_cache always;
    add_header Vary $kf_vary always;             # empty value → header not sent

    # Pages: /menu/ → /menu/index.html; /menu → 301 /menu/ (Nginx adds the slash for directories).
    location / {
        try_files $uri $uri/ =404;
    }

    # Same URL, smaller file: the .avif/.webp sibling when the browser accepts it.
    location ~* ^/assets/.+\.(jpe?g|png)$ {
        try_files $uri$kf_img_suffix $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }
}

server {
    listen 80;
    server_name www.example.com;
    return 301 https://$host$request_uri;
}

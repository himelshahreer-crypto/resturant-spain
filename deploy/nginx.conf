# Kebab Factory static site: Nginx server block (same rules as deploy/.htaccess).
# Point `root` at the uploaded contents of out/. Replace the domain and certificate paths.

map $http_accept $kf_img_suffix {
    default        "";
    "~*image/avif" ".avif";
    "~*image/webp" ".webp";
}

server {
    listen 443 ssl http2;
    server_name www.example.com;            # your domain
    # ssl_certificate     /etc/letsencrypt/live/www.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.example.com/privkey.pem;

    root /var/www/kebabfactory;              # contents of out/
    index index.html;
    charset utf-8;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css text/plain text/xml application/javascript application/json image/svg+xml application/manifest+json;

    # Security headers (the Content-Security-Policy itself is in each page's <head>).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    types { image/avif avif; image/webp webp; application/manifest+json webmanifest; }

    # Pages: /menu/ → /menu/index.html; always revalidate.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Same URL, smaller file: .avif/.webp sibling when the browser accepts it.
    location ~* ^/assets/.+\.(jpe?g|png)$ {
        add_header Vary Accept;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri$kf_img_suffix $uri =404;
    }

    # Content-hashed or versioned: cache for a year.
    location /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /fonts/        { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /styles/       { add_header Cache-Control "public, max-age=31536000, immutable"; }
}

server {
    listen 80;
    server_name www.example.com;
    return 301 https://$host$request_uri;
}
